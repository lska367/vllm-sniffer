name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python pytest msgspec "pyarrow>=14" \
            "fastapi>=0.110" "uvicorn>=0.27" "httpx>=0.27" \
            torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: .venv/bin/python -m pytest -v

      - name: Verify tools CLIs are runnable (no-op help)
        run: |
          .venv/bin/python tools/export_parquet.py --help >/dev/null
          .venv/bin/python tools/latency_report.py --help >/dev/null
          .venv/bin/python tools/repro_compare.py --help >/dev/null
          .venv/bin/python tools/logits_fp_compare.py --help >/dev/null
          .venv/bin/python -m webapp.server --help >/dev/null
